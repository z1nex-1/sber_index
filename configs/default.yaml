seed: 42

data:
  raw_dir: data/raw/hackathonlicence
  dictionary: data/raw/t_dict_municipal_districts.xlsx
  min_months: 24

features:
  categories: [Продовольствие, Здоровье, Маркетплейсы, Общественное питание, Транспорт]
  smoothing_window: 3
  share_floor: 0.002
  relative_to_month: true
  use_rhythm: true
  use_market_access: false
  weights:
    structure: 1.0
    level: 1.0
    rhythm: 0.6
    market_access: 0.5

graph:
  k: 15
  rules: [cosine, residual_corr, lagged_corr, dtw, road, hybrid, multiplex]
  multiplex_layers: [cosine, residual_corr, road]
  dtw_band: 2
  dtw_candidates: 60
  lag_max: 2
  corr_window: 12
  road_scale_km: 300
  hybrid_alpha: 0.7

clustering:
  k_range: [4, 12]
  methods: [kmeans, gmm, ward, spectral, leiden, attributed_spectral, sefnac, dmon]
  graph_rules: [hybrid, cosine, residual_corr, lagged_corr, dtw, road, multiplex]
  min_share: 0.01
  bootstrap: 20
  bootstrap_frac: 0.8
  top_for_stability: 12

temporal:
  match_threshold: 0.3
