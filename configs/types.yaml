# Имена типов подбираются по профилям после каждого переобучения модели.
# Ключ — номер типа (типы упорядочены по уровню трат на жителя, 0 — самый высокий).
k: 7
types:
  0:
    name: Центр и запад Москвы
    desc: Центральный округ Москвы и районы запада, юго-запада и севера — от Хамовников и Раменок до Сокола и Тёплого Стана. Жители тратят больше чем вдвое против медианы по стране, общепит занимает в бюджете втрое большую долю, на продукты уходит на треть меньше обычного.
    short: Центр Москвы
    color: "#8e3d1a"
    hatch: cross
  1:
    name: Московская агломерация
    desc: Восток и юго-восток Москвы, города Подмосковья от Балашихи до Дубны и областные центры вокруг — Калуга, Тула, Рязань, Тверь, Смоленск. Траты на жителя на три четверти выше медианы, общепит и транспорт заметно выше обычного, продукты — ниже.
    short: Московская агломерация
    color: "#d6518a"
    hatch: dots
  2:
    name: Петербург и его пригороды
    desc: Почти все муниципальные округа Петербурга и ближние районы Ленинградской области. Уровень трат как в Подмосковье, но в структуре меньше маркетплейсов и больше расходов на здоровье.
    short: Петербургская агломерация
    color: "#773fa3"
    hatch: diagonal
  3:
    name: Северные ресурсные территории
    desc: Югра, Ямал, Мурманская область, Карелия, Коми, Камчатка — девять из десяти на Крайнем Севере. Траты на жителя на 60% выше медианы, летом растут сильнее, чем в среднем по стране, на транспорт внутри территории тратят меньше.
    short: Север
    color: "#158ac5"
    hatch: horizontal
  4:
    name: Промышленные и региональные города
    desc: Городские округа и районы вокруг региональных центров Урала, Сибири, Поволжья и Дальнего Востока. Структура трат близка к средней по стране, уровень на 15–20% выше медианы, общепит в полтора раза выше.
    short: Города
    color: "#ee9852"
    hatch: antidiagonal
  5:
    name: Удалённые районы с сезонными тратами
    desc: Сельские районы Якутии, Забайкалья, Тывы, Республики Алтай и Сахалина, почти половина — на Крайнем Севере. Самая сильная сезонность трат и летний пик, высокая доля транспорта, маркетплейсы на треть ниже обычного.
    short: Удалённые районы
    color: "#34cca7"
    hatch: vertical
  6:
    name: Сельская и малогородская Россия
    desc: Половина муниципалитетов страны — районы Центра, Поволжья, Юга и Южной Сибири. Траты на 15% ниже медианы, доля продуктов и маркетплейсов выше, общепит на треть ниже обычного. Внутри типа различия плавные, устойчиво разделить его на части не удаётся.
    short: Малые города и село
    color: "#748b0b"
    hatch: grid
