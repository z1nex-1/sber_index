# Имена типов подбираются по профилям после каждого переобучения модели.
# Ключ — номер типа (типы упорядочены по уровню трат на жителя, 0 — самый высокий).
k: 8
types:
  0:
    name: Столицы и ближние пригороды
    desc: Москва, Петербург и ближнее Подмосковье. Расходы на жителя почти вдвое выше медианы по стране, доля общепита втрое больше обычной, а на продукты уходит меньше трети бюджета.
    short: Столицы
    color: "#8e3d1a"
    hatch: cross
  1:
    name: Северные и удалённые территории
    desc: Якутия, Ямал, Мурманская область, Камчатка, Югра. Расходы высокие, но доля маркетплейсов самая низкая — на 30% ниже средней. Вероятная причина — долгая и дорогая доставка.
    short: Север
    color: "#158ac5"
    hatch: horizontal
  2:
    name: Промышленные и региональные центры
    desc: Городские округа и крупные районные центры Урала, Подмосковья, Башкирии, Кузбасса. Расходы на четверть выше медианы, доля общепита и транспорта выше средней.
    short: Центры
    color: "#773fa3"
    hatch: diagonal
  3:
    name: Восточная периферия
    desc: Приморье, Забайкалье, Приамурье, Сахалин. Уровень расходов близок к среднему, но на маркетплейсы тратят на треть меньше — покупки остаются в обычных магазинах.
    short: Восток
    color: "#34cca7"
    hatch: vertical
  4:
    name: Районы Сибири и Урала
    desc: Районы Иркутской, Новосибирской, Тюменской областей, Красноярского края. Уровень трат средний, доля транспорта на 17% выше обычной.
    short: Сибирь и Урал
    color: "#b79efd"
    hatch: antidiagonal
  5:
    name: Малые города и районы Центра
    desc: Малые города и районы Центра и Урала. Средний уровень трат, маркетплейсы заметнее обычного, общепит и транспорт — слабее.
    short: Малые города
    color: "#d6518a"
    hatch: dots
  6:
    name: Аграрная глубинка
    desc: Сельские районы Поволжья и Черноземья. Самая высокая доля маркетплейсов (+25%) и продуктов, а общепит вдвое слабее, чем в среднем по стране.
    short: Глубинка
    color: "#748b0b"
    hatch: grid
  7:
    name: Сельская периферия с низкими расходами
    desc: Районы Алтайского края, Башкирии, Омской области, Татарстана, Кировской области. Самые низкие расходы — на 23% ниже медианы, основная часть уходит на продукты.
    short: Низкие расходы
    color: "#ee9852"
    hatch: none
